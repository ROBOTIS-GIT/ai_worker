/**:
  # controller_spawn is a custom launch configuration.
  # controller_spawn is not an actual ROS 2 node.
  # Read by the follower launch to spawn controllers and run initialization; add controllers here for automatic startup.
  controller_spawn:
    ros__parameters:
      controllers:
        - hand_l_controller
        - hand_r_controller
        - effort_l_controller
        - effort_r_controller
        - pressure_l_broadcaster
        - pressure_r_broadcaster
      executors:
        - hand_l_joint_trajectory_executor
        - hand_r_joint_trajectory_executor

  controller_manager:
    ros__parameters:
      hand_l_controller:
        type: joint_trajectory_controller/JointTrajectoryController
      hand_r_controller:
        type: joint_trajectory_controller/JointTrajectoryController
      effort_l_controller:
        type: effort_controllers/JointGroupEffortController
      effort_r_controller:
        type: effort_controllers/JointGroupEffortController
      pressure_l_broadcaster:
        type: robotis_hand_pressure_broadcaster/PressureBroadcaster
      pressure_r_broadcaster:
        type: robotis_hand_pressure_broadcaster/PressureBroadcaster

  hand_l_controller:
    ros__parameters:
      joints: [finger_l_joint1, finger_l_joint2, finger_l_joint3, finger_l_joint4,
               finger_l_joint5, finger_l_joint6, finger_l_joint7, finger_l_joint8,
               finger_l_joint9, finger_l_joint10, finger_l_joint11, finger_l_joint12,
               finger_l_joint13, finger_l_joint14, finger_l_joint15, finger_l_joint16,
               finger_l_joint17, finger_l_joint18, finger_l_joint19, finger_l_joint20]
      command_interfaces: [position]
      state_interfaces: [position, velocity]
      allow_nonzero_velocity_at_trajectory_end: true
      allow_partial_joints_goal: true

  hand_r_controller:
    ros__parameters:
      joints: [finger_r_joint1, finger_r_joint2, finger_r_joint3, finger_r_joint4,
               finger_r_joint5, finger_r_joint6, finger_r_joint7, finger_r_joint8,
               finger_r_joint9, finger_r_joint10, finger_r_joint11, finger_r_joint12,
               finger_r_joint13, finger_r_joint14, finger_r_joint15, finger_r_joint16,
               finger_r_joint17, finger_r_joint18, finger_r_joint19, finger_r_joint20]
      command_interfaces: [position]
      state_interfaces: [position, velocity]
      allow_nonzero_velocity_at_trajectory_end: true
      allow_partial_joints_goal: true

  effort_l_controller:
    ros__parameters:
      joints: [finger_l_joint1, finger_l_joint2, finger_l_joint3, finger_l_joint4,
               finger_l_joint5, finger_l_joint6, finger_l_joint7, finger_l_joint8,
               finger_l_joint9, finger_l_joint10, finger_l_joint11, finger_l_joint12,
               finger_l_joint13, finger_l_joint14, finger_l_joint15, finger_l_joint16,
               finger_l_joint17, finger_l_joint18, finger_l_joint19, finger_l_joint20]

  effort_r_controller:
    ros__parameters:
      joints: [finger_r_joint1, finger_r_joint2, finger_r_joint3, finger_r_joint4,
               finger_r_joint5, finger_r_joint6, finger_r_joint7, finger_r_joint8,
               finger_r_joint9, finger_r_joint10, finger_r_joint11, finger_r_joint12,
               finger_r_joint13, finger_r_joint14, finger_r_joint15, finger_r_joint16,
               finger_r_joint17, finger_r_joint18, finger_r_joint19, finger_r_joint20]

  pressure_l_broadcaster:
    ros__parameters:
      topic_name: /left_hand/finger_pressures
      sensor_names: [finger_l_sensor1, finger_l_sensor2, finger_l_sensor3,
                     finger_l_sensor4, finger_l_sensor5]
      interface_names: [Present Pressure 1, Present Pressure 2, Present Pressure 3,
                        Present Pressure 4, Present Pressure 5, Present Pressure 6,
                        Present Pressure 7, Present Pressure 8, Present Pressure 9]

  pressure_r_broadcaster:
    ros__parameters:
      topic_name: /right_hand/finger_pressures
      sensor_names: [finger_r_sensor1, finger_r_sensor2, finger_r_sensor3,
                     finger_r_sensor4, finger_r_sensor5]
      interface_names: [Present Pressure 1, Present Pressure 2, Present Pressure 3,
                        Present Pressure 4, Present Pressure 5, Present Pressure 6,
                        Present Pressure 7, Present Pressure 8, Present Pressure 9]
