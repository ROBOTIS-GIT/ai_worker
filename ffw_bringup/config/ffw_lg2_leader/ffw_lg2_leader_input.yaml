# LG2 reference kinematics; independent of the hardware robot_description.
/leader/joint_trajectory_command_broadcaster:
  ros__parameters:
    leader_pose_reference_enabled: true
    # Scale relative translation from the selected FK model in /action/*/pose.
    # Rotation stays 1:1. Configure before launch; 1.0 preserves existing motion.
    cartesian_scaling:
      left_translation_gain: 1.0
      right_translation_gain: 1.0
    leader_urdf_path: "$(find-pkg-share cyclo_motion_controller_models)/models/ai_worker/leader/ffw_lg2_leader.urdf"
    leader_use_follower_reference_model: false
    # Exclude the model's virtual lift joint from leader arm FK inputs.
    leader_base_frame: arm_base_link
    leader_left_eef: "gripper_l_link1"
    leader_right_eef: "gripper_r_link1"
    follower_control_node: /cyclo_teleoperation
