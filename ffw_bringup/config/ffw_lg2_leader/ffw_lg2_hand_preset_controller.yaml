/**:
  hand_preset_controller:
    ros__parameters:
      leader_joint_states_topic: /leader/joint_states
      robot_description_topic: /robot_description
      publish_rate: 50.0
      time_from_start: 0.0
      preset_switch_duration: 1.0
      leader_state_timeout: 0.5
      # Raw leader gripper positions (rad) mapped to release (0.0) and grasp (1.0).
      # Defaults match the 0.3 rad gripper offset and the 0.0-1.1 rad follower gripper range.
      left:
        gripper_joint: gripper_l_joint1
        gripper_release_position: -0.3
        gripper_grasp_position: 0.8
      right:
        gripper_joint: gripper_r_joint1
        gripper_release_position: -0.3
        gripper_grasp_position: 0.8
