/**:
  joystick_controller:
    ros__parameters:
      joystick_sensors:
        - sensorxel_l_joy
        - sensorxel_r_joy
      state_interfaces:
        - JOYSTICK X VALUE
        - JOYSTICK Y VALUE
        - JOYSTICK TACT SWITCH
      sensorxel_l_joy_reverse_interfaces:
        - JOYSTICK Y VALUE
        - JOYSTICK X VALUE
      joystick_calibration_min: 0.0
      joystick_calibration_center: 2048.0
      joystick_calibration_max: 4096.0
      sensorxel_l_joy_controlled_joints:
        - head_joint1
        - head_joint2
      sensorxel_r_joy_controlled_joints:
        - lift_joint
      joint_states_topic: "/joint_states"
      sensorxel_l_joy_joint_trajectory_topic: "/leader/joystick_controller_left/joint_trajectory_"
      sensorxel_r_joy_joint_trajectory_topic: "/leader/joystick_controller_right/joint_trajectory"
      sensorxel_l_joy_joint_states_stamped_topic: "/robot/head_leader/joint_states_"
      sensorxel_r_joy_joint_states_stamped_topic: "/robot/lift_leader/joint_states"
      sensorxel_l_joy_jog_scale: 0.06
      sensorxel_r_joy_jog_scale: 0.01
      deadzone: 1.00
      enable_joystick_update: true
