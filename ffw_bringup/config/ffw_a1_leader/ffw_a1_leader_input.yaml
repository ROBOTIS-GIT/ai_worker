# A1 supplies physical JointState samples to the unchanged shared pose bridge.
/leader/joint_trajectory_command_broadcaster:
  ros__parameters:
    leader_pose_reference_enabled: true
    leader_urdf_path: "$(find-pkg-share cyclo_motion_controller_models)/models/ai_worker/leader/ffw_a1_leader.urdf"
    # Relative to /leader: FK always reads measured positions, even during mode changes.
    leader_joint_states_topic: "joint_states"
    # Track the physical A1 hand motion for every follower, including F1/F2.
    leader_use_follower_reference_model: false
    leader_base_frame: "arm_base_link"
    # A1 tool frames coincide with the seventh arm links until TCP calibration.
    leader_left_eef: "end_effector_l_link"
    leader_right_eef: "end_effector_r_link"
    # Physical joint names need no remapping. Omit model_joints to use the typed
    # empty string-array defaults; an explicit YAML [] has no ROS parameter type.
    follower_control_node: /cyclo_teleoperation
