leader_joystick_controller:
  teleoperation_toggle_enabled: {
    type: bool,
    default_value: false,
    description: "Publish per-arm AI Worker teleoperation toggle commands",
    read_only: true
  }
  teleoperation_command_topic: {
    type: string,
    default_value: "/leader/teleoperation/joystick_command",
    description: "Topic for AI Worker teleoperation button commands",
    read_only: true
  }
  leader_mode_switch_long_press_duration: {
    type: double,
    default_value: 1.0,
    description: "Leader both-button hold duration for joystick mode switching",
    read_only: true
  }
