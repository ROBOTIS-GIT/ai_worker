a1_joint_trajectory_command_broadcaster:
  leader_joint_states_topic:
    type: string
    default_value: "joint_states"
    read_only: true
    description: "Physical A1 JointState input for FK; independent of MoveJ mapping and gains."
  joint6_scaling:
    gain:
      type: double
      default_value: 1.0
      read_only: true
      description: "MoveJ upward gain for both A1 joint6 axes. 1.0 disables scaling."
  joint7_scaling:
    gain:
      type: double
      default_value: 1.0
      read_only: true
      description: "MoveJ outward gain for both A1 joint7 axes. 1.0 disables scaling."
